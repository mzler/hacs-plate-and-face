---
name: "Plate & Face Recognition"
version: "1.0.0"
slug: plate_face_recognition
description: "Lokale Nummernschild- und Gesichtserkennung via OpenCV/EasyOCR und face_recognition – ohne Cloud, ohne API-Keys."
url: "https://github.com/timohaberl/hacs-plate-face-recognition"

arch:
  - amd64
  - aarch64

# REST API port (exposed to HA network)
ports:
  8585/tcp: 8585
ports_description:
  8585/tcp: "REST API für die Custom Integration"

# Gesichts-Datenbank liegt in /share – wird zwischen Add-on-Neustarts bewahrt
map:
  - share:rw

options:
  port: 8585

schema:
  port: int

# Add-on läuft ohne HA Supervisor init-System
init: false

# Kein Ingress nötig (Custom Component kommuniziert direkt via HTTP)
