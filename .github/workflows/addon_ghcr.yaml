name: Publish Add-on to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'addons/plate_face_recognition/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: addons/plate_face_recognition
          file: Dockerfile
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:2.0.5
