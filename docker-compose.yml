services:

  homeassistant:
    container_name: ha-plate-face-demo
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: false
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Vienna
    volumes:
      - ./docker/homeassistant:/config
      - ./custom_components/plate_face_recognition:/config/custom_components/plate_face_recognition:ro
    networks:
      - pfr-network

  pfr-addon:
    container_name: pfr-addon
    hostname: pfr-addon
    build:
      context: ./addons/plate_face_recognition
      dockerfile: Dockerfile.compose
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      - TZ=Europe/Vienna
      - PFR_DATA_DIR=/data
    volumes:
      - ./docker/faces:/data
    networks:
      - pfr-network

  demo-camera:
    container_name: ha-demo-camera
    hostname: ha-demo-camera
    build:
      context: ./docker/demo-camera
    restart: unless-stopped
    ports:
      - "8554:8554"
    networks:
      - pfr-network

  eufy-security-ws:
    container_name: eufy-security-ws
    image: bropat/eufy-security-ws:latest
    restart: unless-stopped
    environment:
      - USERNAME=your_email@example.com
      - PASSWORD=your_password
      - COUNTRY=DE
      - TRUSTED_DEVICE_NAME=HomeAssistantDemo
    ports:
      - "3000:3000"
    networks:
      - pfr-network

networks:
  pfr-network:
    driver: bridge
