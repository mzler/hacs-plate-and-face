# Home Assistant Demo Configuration
# ===================================
# Diese Konfiguration ist für die lokale Entwicklungs-Demo gedacht.

homeassistant:
  name: Plate & Face Demo
  latitude: 48.2082
  longitude: 16.3738
  elevation: 171
  unit_system: metric
  currency: EUR
  country: AT
  time_zone: Europe/Vienna
  language: de

# Grundlegende Integrationen
default_config:

# HTTP – für Docker ohne SSL
http:
  server_host: "0.0.0.0"
  server_port: 8123
  ip_ban_enabled: false
  login_attempts_threshold: -1

# Logger für die Integration
logger:
  default: warning
  logs:
    custom_components.plate_face_recognition: debug
    easyocr: warning
    face_recognition: info

# Frontend
frontend:
  themes: {}

# ---------------------------------------------------------------------------
# Management Dashboard (Ersatz für Panel)
# ---------------------------------------------------------------------------
lovelace:
  mode: yaml
  resources: []
  dashboards:
    pfr-management:
      mode: yaml
      filename: pfr_dashboard.yaml
      title: "Personen & Kennzeichen"
      icon: mdi:account-badge-outline
      show_in_sidebar: true
      require_admin: true

# ---------------------------------------------------------------------------
# Fake Kameras für Tests (FFMPEG)
# ---------------------------------------------------------------------------
ffmpeg:

camera:
  - platform: ffmpeg
    name: "Demo Kamera (FFMPEG)"
    input: "http://ha-demo-camera:8554/stream"
    extra_arguments: -pred 1
